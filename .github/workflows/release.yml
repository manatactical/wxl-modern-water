# Builds wxl-modern-water.dll against wxl-core's build shell and publishes the whole package as a
# GitHub Release on every push to main/master.
#
# The WarcraftXL Hub installer fetches exactly ONE release asset and only understands a bare .dll or a
# zip it can extract (see wxl-hub core/extensions/install.lua). This module ships an .ini and an 8 MB
# waterdata.bin beside the DLL, so a bare .dll asset would leave the data behind. The release is
# therefore a single zip, and wxl.json's deploy.match selects it with "*.zip".
#
# wxl-core is checked out fresh each run (branch v1.1) and this extension's own source is copied into
# its extensions/wxl-modern-water/ folder, where wxl-core's root CMakeLists.txt auto-discovers it as
# a build target -- no CMakeLists.txt of our own needed. The release tag tracks wxl.json's own version
# field, so pushing without bumping it updates the existing release in place.
name: Build and Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write   # needed to publish a Release

env:
  EXT_NAME: wxl-modern-water
  CORE_REPO: WarcraftXL/wxl-core
  CORE_REF: v1.1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout this extension
        uses: actions/checkout@v4
        with:
          path: ext

      - name: Checkout wxl-core (${{ env.CORE_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_REF }}
          submodules: recursive
          path: core

      - name: Drop this extension's source into core/extensions/
        shell: pwsh
        run: |
          $dest = "core/extensions/$env:EXT_NAME"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "ext/*" -Destination $dest -Recurse -Force

      - name: Configure (Win32)
        shell: pwsh
        run: cmake -S core -B core/build -A Win32

      - name: Build
        shell: pwsh
        run: cmake --build core/build --config Release --target $env:EXT_NAME --parallel

      - name: Stage the package
        shell: pwsh
        run: |
          # Everything lands at the zip root: the hub refuses an install that cannot find
          # <id>.dll, and the core reads the ini and waterdata.bin from the extension's own folder.
          $pkg = "pkg"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "core/build/Release/$env:EXT_NAME.dll" -Destination "$pkg/$env:EXT_NAME.dll"
          Copy-Item "ext/wxl-modern-water.ini"              -Destination "$pkg/wxl-modern-water.ini"
          Copy-Item "ext/data/waterdata.bin"                -Destination "$pkg/waterdata.bin"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$env:EXT_NAME.zip" -Force

      - name: Read the version out of the manifest
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content ext/wxl.json -Raw | ConvertFrom-Json).extension.version
          if (-not $v) { throw "wxl.json carries no extension.version" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ${{ env.EXT_NAME }} ${{ steps.v.outputs.version }}
          body: Built from ${{ github.sha }}
          files: ${{ env.EXT_NAME }}.zip
